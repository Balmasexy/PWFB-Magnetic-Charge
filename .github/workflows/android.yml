name: Build MagCharge Release AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MAGCHARGE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/magcharge-release.jks"
          test -s "$RUNNER_TEMP/magcharge-release.jks"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build signed release AAB
        env:
          MAGCHARGE_STORE_PASSWORD: ${{ secrets.MAGCHARGE_STORE_PASSWORD }}
          MAGCHARGE_KEY_PASSWORD: ${{ secrets.MAGCHARGE_KEY_PASSWORD }}
        run: |
          gradle --no-daemon :app:bundleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/magcharge-release.jks" \
            -Pandroid.injected.signing.store.password="$MAGCHARGE_STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="magcharge" \
            -Pandroid.injected.signing.key.password="$MAGCHARGE_KEY_PASSWORD"

      - name: Verify AAB
        run: |
          ls -lh app/build/outputs/bundle/release/
          test -s app/build/outputs/bundle/release/app-release.aab

      - name: Upload MagCharge Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: MagCharge-release-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
